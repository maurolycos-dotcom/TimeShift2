<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluguhr Simulation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e6e6e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #16213e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            color: #00fff5;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }

        .clock-display {
            background: #0f3460;
            border: 2px solid #00fff5;
            border-radius: 10px;
            text-align: center;
            padding: 20px;
            margin-bottom: 25px;
        }

        .clock-time {
            font-size: 3.5rem;
            font-weight: bold;
            color: #00fff5;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .clock-label {
            font-size: 0.9rem;
            color: #8a99ad;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #b8c7d9;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #0f3460;
            background-color: #0f3460;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #00fff5;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: #00fff5;
            color: #16213e;
        }

        .btn-primary:hover {
            background-color: #00d8cf;
        }

        .btn-secondary {
            background-color: #e94560;
            color: #fff;
        }

        .btn-secondary:hover {
            background-color: #c7364d;
        }

        .info-panel {
            margin-top: 20px;
            background-color: #0f3460;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ Fluguhr-Simulator</h1>

    <div class="clock-display">
        <div class="clock-time" id="uhrenAnzeige">17:04:00</div>
        <div class="clock-label" id="statusLabel">Bereit zum Start</div>
    </div>

    <div class="form-group">
        <label for="startzeit">Abflugzeit (Ortszeit Abflugort):</label>
        <input type="time" id="startzeit" value="17:04">
    </div>

    <div class="form-group">
        <label for="flugdauer">Geplante Flugdauer (in Stunden):</label>
        <input type="number" id="flugdauer" value="12" step="0.1" min="0.1">
    </div>

    <div class="form-group">
        <label for="zeitdifferenz">Zeitunterschied (Stunden, z.B. -6 für Singapur -> MUC):</label>
        <input type="number" id="zeitdifferenz" value="-6" step="0.5">
    </div>

    <div class="btn-group">
        <button class="btn-primary" id="btnStart" onclick="starteFlug()">Flug Starten</button>
        <button class="btn-secondary" onclick="stoppeFlug()">Stopp</button>
    </div>

    <div class="btn-group">
        <button style="background: #2b3a55; color: #fff;" onclick="spuleVor(70)">+1h 10m spulen</button>
    </div>

    <div class="info-panel">
        <div class="info-row">
            <span>Verstrichene Flugzeit (real):</span>
            <strong id="realZeit">00:00:00</strong>
        </div>
        <div class="info-row">
            <span>Uhren-Geschwindigkeit:</span>
            <strong id="faktorAnzeige">1.00x</strong>
        </div>
    </div>
</div>

<script>
    let timerInterval = null;
    let startZeitstempel = null;
    let vergangeneRealSekunden = 0;

    function berechneUhrzeit(startzeitStr, flugdauerStd, zeitdiffStd, realSekunden) {
        // 1. Startzeit in Minuten seit Mitternacht umwandeln
        const [stunden, minuten] = startzeitStr.split(':').map(Number);
        const startMinuten = stunden * 60 + minuten;

        const flugdauerMinuten = flugdauerStd * 60;
        const zeitdiffMinuten = zeitdiffStd * 60;

        // 2. Faktor berechnen
        const faktor = 1 + (zeitdiffMinuten / flugdauerMinuten);

        // 3. Vergangene Uhrenminuten berechnen
        const realMinuten = realSekunden / 60;
        const uhrenMinutenFortschritt = realMinuten * faktor;

        // 4. KORREKTUR: Startet bei der echten Abflugzeit (z.B. 17:04) ohne vorherigen Zeitabzug
        let aktuelleUhrenMinuten = startMinuten + uhrenMinutenFortschritt;

        // Modulo für 24-Stunden-Überlauf
        aktuelleUhrenMinuten = (aktuelleUhrenMinuten % 1440 + 1440) % 1440;

        // Formatierung HH:MM:SS
        const hh = Math.floor(aktuelleUhrenMinuten / 60);
        const mm = Math.floor(aktuelleUhrenMinuten % 60);
        const ss = Math.floor((aktuelleUhrenMinuten * 60) % 60);

        return {
            zeitString: `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`,
            faktor: faktor
        };
    }

    function aktualisiereAnzeige() {
        const startzeit = document.getElementById('startzeit').value;
        const flugdauer = parseFloat(document.getElementById('flugdauer').value);
        const zeitdifferenz = parseFloat(document.getElementById('zeitdifferenz').value);

        const ergebnis = berechneUhrzeit(startzeit, flugdauer, zeitdifferenz, vergangeneRealSekunden);

        document.getElementById('uhrenAnzeige').innerText = ergebnis.zeitString;
        document.getElementById('faktorAnzeige').innerText = ergebnis.faktor.toFixed(2) + "x";

        const rStd = Math.floor(vergangeneRealSekunden / 3600);
        const rMin = Math.floor((vergangeneRealSekunden % 3600) / 60);
        const rSek = Math.floor(vergangeneRealSekunden % 60);
        document.getElementById('realZeit').innerText = 
            `${String(rStd).padStart(2, '0')}:${String(rMin).padStart(2, '0')}:${String(rSek).padStart(2, '0')}`;
    }

    function starteFlug() {
        stoppeFlug();
        document.getElementById('statusLabel').innerText = "Flug läuft...";
        document.getElementById('statusLabel').style.color = "#00fff5";

        timerInterval = setInterval(() => {
            vergangeneRealSekunden++;
            aktualisiereAnzeige();
        }, 1000);
    }

    function stoppeFlug() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('statusLabel').innerText = "Pausiert / Gestoppt";
            document.getElementById('statusLabel').style.color = "#e94560";
        }
    }

    function spuleVor(minuten) {
        vergangeneRealSekunden += minuten * 60;
        aktualisiereAnzeige();
    }

    aktualisiereAnzeige();
</script>

</body>
</html>
